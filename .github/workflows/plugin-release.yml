name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@ce2d270132b064021f327a154924c971802950cd
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: >-
        git lfs pull --include='backend/models/*.rten' &&
        for model in backend/models/*.rten; do
          if [ "$(dd if="$model" bs=4 count=1 2>/dev/null)" != "RTEN" ]; then
            echo "::error file=$model::OCR model is not a hydrated RTEN file. Ensure Git LFS objects are available before packaging.";
            exit 1;
          fi;
        done;
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y libwayland-dev;
        fi;
        npm ci && npm test && npm run build && npx --yes --package=@dbx-app/plugin-cli@0.1.6 dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
