schema_version = 1

[backend]
language = "rust"
directory = "backend"
binary = "dbx-plugin-toolbox"

[package]
include = ["assets", "ui"]

[dev]
ui_build = ["node", "-e", "let c=process.cwd();const q=c.indexOf('?');if(q>=0&&q<=3)c=c.slice(q+2);process.chdir(c);const r=require('child_process').spawnSync(process.execPath,[require('path').join(c,'node_modules/vite/bin/vite.js'),'build'],{cwd:c,stdio:'inherit'});process.exit(r.status==null?1:r.status)"]
ui_watch = ["node", "-e", "let c=process.cwd();const q=c.indexOf('?');if(q>=0&&q<=3)c=c.slice(q+2);process.chdir(c);const r=require('child_process').spawnSync(process.execPath,[require('path').join(c,'node_modules/vite/bin/vite.js'),'build','--watch'],{cwd:c,stdio:'inherit'});process.exit(r.status==null?1:r.status)"]
